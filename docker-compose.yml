services:
  # ── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matchwatch
      POSTGRES_PASSWORD: matchwatch_dev
      POSTGRES_DB: matchwatch
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchwatch"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Backend ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      POSTGRES_PASSWORD: matchwatch_dev
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://matchwatch:matchwatch_dev@postgres:5432/matchwatch}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      RUN_STARTUP_MIGRATIONS: ${RUN_STARTUP_MIGRATIONS:-true}
      RUN_STARTUP_SEED: ${RUN_STARTUP_SEED:-true}
      ENABLE_MATCH_SYNC_WORKER: ${ENABLE_MATCH_SYNC_WORKER:-true}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_VERIFY_EMAIL: ${AUTO_VERIFY_EMAIL:-true}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-200}
      PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-2000}
      MATCH_SYNC_PROVIDER: ${MATCH_SYNC_PROVIDER:-}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}
      API_FOOTBALL_API_KEY: ${API_FOOTBALL_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_RECAP_CRON: "${YOUTUBE_RECAP_CRON:-0 12 * * *}"
      YOUTUBE_RECAP_BATCH_LIMIT: ${YOUTUBE_RECAP_BATCH_LIMIT:-12}
      YOUTUBE_RECAP_LEAGUES: ${YOUTUBE_RECAP_LEAGUES:-mls}
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACES_BASE_URL: ${GOOGLE_PLACES_BASE_URL:-https://places.googleapis.com/v1}
      ENTITY_ENRICHMENT_PROVIDER: ${ENTITY_ENRICHMENT_PROVIDER:-generated}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_LOCATION: ${SERPAPI_LOCATION:-}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
      GOOGLE_SEARCH_ENGINE_ID: ${GOOGLE_SEARCH_ENGINE_ID:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      THE_SPORTS_DB_API_KEY: ${THE_SPORTS_DB_API_KEY:-}
      THE_SPORTS_DB_BASE_URL: ${THE_SPORTS_DB_BASE_URL:-}
      JOLPICA_BASE_URL: ${JOLPICA_BASE_URL:-https://api.jolpi.ca/ergast}
      ESPN_SCOREBOARD_BASE_URL: ${ESPN_SCOREBOARD_BASE_URL:-https://site.api.espn.com/apis/site/v2/sports}

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-matchwatch-uploads}
      CDN_URL: ${CDN_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_PASSWORD_HASH: ${SUPER_ADMIN_PASSWORD_HASH:-}
      SUPER_ADMIN_SESSION_SECRET: ${SUPER_ADMIN_SESSION_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://44.215.158.165}
      APP_URL: ${APP_URL:-http://44.215.158.165}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Frontend (Next.js) ──────────────────────
  frontend:
    build:
      context: ./HtownKickoff-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
        API_PROXY_TARGET: ${DOCKER_API_PROXY_TARGET:-http://api:4000}
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      API_PROXY_TARGET: ${DOCKER_API_PROXY_TARGET:-http://api:4000}

  # ── MailHog (dev only) ──────────────────────
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
    profiles: [dev]

volumes:
  pgdata:
