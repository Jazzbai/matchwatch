<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Stadium outline -->
  <ellipse cx="400" cy="380" rx="380" ry="120" stroke="currentColor" stroke-width="2" opacity="0.15"/>
  <ellipse cx="400" cy="360" rx="350" ry="100" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <!-- Field lines -->
  <rect x="100" y="200" width="600" height="200" rx="5" stroke="currentColor" stroke-width="1.5" opacity="0.12"/>
  <line x1="400" y1="200" x2="400" y2="400" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <circle cx="400" cy="300" r="60" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <!-- Goal areas -->
  <rect x="100" y="260" width="80" height="80" rx="3" stroke="currentColor" stroke-width="1" opacity="0.08"/>
  <rect x="620" y="260" width="80" height="80" rx="3" stroke="currentColor" stroke-width="1" opacity="0.08"/>
  <!-- Floodlight beams -->
  <line x1="50" y1="50" x2="200" y2="200" stroke="currentColor" stroke-width="3" opacity="0.04"/>
  <line x1="750" y1="50" x2="600" y2="200" stroke="currentColor" stroke-width="3" opacity="0.04"/>
  <line x1="50" y1="50" x2="300" y2="200" stroke="currentColor" stroke-width="2" opacity="0.03"/>
  <line x1="750" y1="50" x2="500" y2="200" stroke="currentColor" stroke-width="2" opacity="0.03"/>
  <!-- Floodlight poles -->
  <line x1="50" y1="50" x2="50" y2="200" stroke="currentColor" stroke-width="3" opacity="0.1"/>
  <line x1="750" y1="50" x2="750" y2="200" stroke="currentColor" stroke-width="3" opacity="0.1"/>
  <circle cx="50" cy="45" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.1"/>
  <circle cx="750" cy="45" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.1"/>
</svg>
